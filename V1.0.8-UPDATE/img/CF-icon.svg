<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="24" viewBox="0 0 48 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo rectangular con borde -->
  <rect x="1" y="1" width="46" height="22" rx="4" ry="4" 
        fill="#ffffff" 
        stroke="#000000" 
        stroke-width="1.5"/>
  
  <!-- Sombra interna 3D -->
  <rect x="3" y="3" width="42" height="18" rx="3" ry="3" 
        fill="none" 
        stroke="#cccccc" 
        stroke-width="0.5" 
        opacity="0.7"/>
  
  <!-- Texto CF centrado y moderno -->
  <text x="24" y="16" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="700" 
        text-anchor="middle" 
        fill="#000000">CF</text>
  
  <!-- Efecto 3D sutil -->
  <text x="25" y="17" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="700" 
        text-anchor="middle" 
        fill="#666666" 
        opacity="0.3">CF</text>
</svg>
